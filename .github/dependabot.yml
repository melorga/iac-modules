version: 2
updates:
  # Terraform module
  - package-ecosystem: terraform
    directory: /modules/s3-static-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, terraform]

  # Terraform example
  - package-ecosystem: terraform
    directory: /examples/s3-static-site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, terraform]

  # GitHub Actions workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]

  # Go modules (Terratest suite)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, go]
